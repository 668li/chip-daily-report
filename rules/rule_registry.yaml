# -----------------------------------------------------------------------------
# 4. 规模与格式阈值（X3 / X12）
# -----------------------------------------------------------------------------
thresholds:
  # X3：摘要句数
  summary_sentences:
    pass_min: 3
    pass_max: 5
    warn_at: 6          # 6 句 WARN
    fail_at: 7          # ≥7 句 FAIL
    fail_below: 3       # ≤2 句 FAIL（与 pass_min 一致边界）
  # X12：单期新闻条数（软指标）
  news_count:
    target_min: 15
    target_max: 20
    warn_min: 10        # 10–14 条 WARN
    warn_max: 25        # 21–25 条 WARN
    fail_below: 10      # <10 条 FAIL
    fail_above: 25      # >25 条 FAIL
    holiday_zero_pass: true   # 0 条（节假日）按既有兜底自动 PASS

# -----------------------------------------------------------------------------
# 5. 分类边界裁决（X9 / X10 / X11）
#    以结构化形式固化，供 classification.md 生成与回归用例引用
# -----------------------------------------------------------------------------
classification_arbitration:
  X9:
    topic: "HBM 类新闻归属"
    verdict: "制造"
    condition: "仅当新闻主体是封装工艺细节（混合键合、热压键合、MR-MUF、堆叠层数工艺）时才归封测"
    basis: "classification.md 存疑仲裁规则明写'HBM 相关新闻归制造'；封测反条目同样写'HBM4 量产不是封测是制造'"
    example_pass: "SK海力士启动12层HBM4量产 → 制造"
    example_fail: "HBM4 进入量产交付 放封测 → 误分类"
  X10:
    topic: "企业上市/IPO 是否纳入"
    verdict: "按主体类型二分"
    rule: |
      晶圆厂、存储厂、封测厂等产能实体的上市/新建/投产，且新闻披露产能或工艺信息的，纳入对应环节；
      芯片设计公司与 AI 芯片公司的纯融资/IPO 事件不纳入。
      正文须以产能与工艺事实为主，募资金额仅作背景。
    basis: "classification.md 制造包含项明列'晶圆厂动态（新建/投产/上市）'并有晶合集成上市正例；存疑仲裁'不纳入'限定语是'AI 芯片公司融资/上市'"
    example_pass: "长鑫科技科创板上市（3 座 12 英寸 DRAM 厂、产能规模）→ 制造"
    example_fail: "某 AI 芯片初创纯融资 5 亿元 → 不纳入"
  X11:
    topic: "股价信息能否出现"
    verdict: "不得作主体/标题主语/今日要点；可作一句影响佐证"
    rule: |
      股价与指数不得作为新闻主体、标题主语或今日要点；
      当股价变动是某技术事件的市场反应且来源已如实报道时，允许在摘要中作为一句影响佐证出现，
      且不得含涨跌预测与投资建议措辞。
    basis: "classification.md 不纳入清单与 rubric #11 禁止股价类内容；EDA 正例保留股价表述，二者以'主体 vs 佐证'划界"
    example_pass: "标题'Kimi K3 48小时自主完成芯片设计'；摘要末句'该进展使 Cadence/Synopsys 股价承压'（一句佐证）"
    example_fail: "标题'Cadence/Synopsys 股价重挫'并列为今日要点第 1 条 → 越界"

# -----------------------------------------------------------------------------
# 6. 格式裁决（X14 / X15 / X16）
#    供脚本 WARN 级检查与模板锁定
# -----------------------------------------------------------------------------
format_rules:
  X14:
    topic: "来源分级统计的位置与格式"
    verdict: "置于 ## 自检结果 小节内部，三行文本格式"
    format: |
      A级（权威）：[列出A级来源域名] = X条
      B级（聚合）：[列出B级来源域名] = Y条
      A级占比：X/(X+Y) = Z% ≥ 30% ✓
    basis: "SKILL.md 输出格式、rubric.md 自检结果输出格式、历史产物 D9/D10 四处一致"
    action: "模板锁定；脚本增位置 WARN 检查"
  X15:
    topic: "环节章节标题写法"
