# =============================================================================
# chip-daily-report 规则注册表（单一权威源 / Single Source of Truth）
# =============================================================================
# 本文件是 X1–X16 上游冲突裁决的唯一落点（F1.1）。
#
# 权威链（X1/X7 裁决）：
#   本注册表(rules/rule_registry.yaml)
#     ├─ 生成 ─> scripts/validate_report.py 的 A/B/C 域名常量（执行权威）
#     └─ 生成 ─> references/sources.md 的 A 级来源表（业务权威，人读）
#
# 一致性铁律（X7）：
#   - 脚本 A_LEVEL_DOMAINS 与 sources.md A 级表 必须由本注册表生成
#   - 三者双向差集必须为 0（check_rules_consistency.py 强制校验）
#   - 任何规则修改只改本文件，再跑 gen_rules.py，禁止手工同步两处
#
# 生成时间基准：2026-08-07
# 对应裁决文档：delivery/高层架构设计.md §3.4（X1–X16）
# =============================================================================

meta:
  version: "1.0"
  kind: "rule-registry"
  owner: "F1 规则治理中心"
  generated_from: "delivery/高层架构设计.md §3.4 (X1–X16)"
  authority_chain:
    registry: "rules/rule_registry.yaml"
    execution: "scripts/validate_report.py (A_LEVEL_DOMAINS / C_LEVEL_DOMAINS / SEGMENTS)"
    business: "references/sources.md (A 级来源表)"
  consistency_rule: "registry == execution == business，三者双向差集必须为 0"

